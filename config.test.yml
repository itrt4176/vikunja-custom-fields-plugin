service:
  secret: "test-secret-do-not-use-in-production"
  testingtoken: "test-token-for-seeding"
  enableregistration: true
  publicurl: "http://127.0.0.1:3456"

cors:
  enable: false

files:
  basepath: /tmp/vikunja-files

database:
  type: sqlite
  path: /db/vikunja.db

plugins:
  enabled: true
  dir: /app/vikunja/plugins
  loader: yaegi

log:
  level: DEBUG
  http: stdout

mailer:
  enabled: false

ratelimit:
  enabled: false
